<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Roulette | Cabaret Host Casinos</title>
  <link rel="stylesheet" href="src/css/style.css" />
  <link rel="stylesheet" href="src/css/roulette.css" />
</head>
<body>
  <div class="g5-ambient" id="ambient" aria-hidden="true"></div>
  <div class="confetti-layer" id="confetti" aria-hidden="true"></div>

  <header class="guest-header">
    <span class="badge">Cabaret Host Casinos</span>
    <h1>Roulette</h1>
    <p class="name">運を試せ — Spin &amp; Win</p>
  </header>

  <main class="container roulette-main">
    <div class="roulette-stage" id="stage">
      <div class="roulette-pointer" aria-hidden="true"></div>
      <div class="roulette-wheel" id="wheel" role="img" aria-label="ルーレット">
        <!-- labels placed by JS for accurate centering -->
        <div class="seg-label" data-i="0">1</div>
        <div class="seg-label" data-i="1">2</div>
        <div class="seg-label" data-i="2">3</div>
        <div class="seg-label" data-i="3">4</div>
        <div class="roulette-center" id="hub"></div>
      </div>
      <div class="spin-glow" id="spin-glow" aria-hidden="true"></div>
    </div>

    <div class="roulette-controls">
      <button type="button" class="btn btn-primary" id="btn-spin">
        <span class="btn-text">SPIN</span>
      </button>
      <p class="result-label" id="result-label">ボタンを押して回せ！</p>
      <p class="result-value" id="result-value" aria-live="polite"></p>
      <p class="result-flavor" id="result-flavor"></p>
    </div>
  </main>

  <footer class="site-footer">
    <strong>Cabaret Host Casinos</strong><br />
    © 2026 Reitaku H.S. 5G
  </footer>

  <script src="src/js/main.js"></script>
  <script src="src/js/roulette.js"></script>
</body>
</html>
