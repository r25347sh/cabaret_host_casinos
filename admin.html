<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Staff | Cabaret Host Casinos</title>
  <link rel="stylesheet" href="src/css/style.css" />
  <link rel="stylesheet" href="src/css/admin.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
  <div class="g5-ambient" id="ambient" aria-hidden="true"></div>

  <div class="admin-wrap">
    <section id="login-section">
      <div class="card login-card">
        <h2>Staff Login</h2>
        <form id="login-form">
          <div class="form-group">
            <label for="login-id">ID</label>
            <input type="text" id="login-id" autocomplete="username" required />
          </div>
          <div class="form-group">
            <label for="login-pass">Password</label>
            <input type="password" id="login-pass" autocomplete="current-password" required />
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center">ログイン</button>
          <p class="form-msg" id="login-msg"></p>
        </form>
      </div>
    </section>

    <section id="admin-panel" class="hidden">
      <div class="admin-header">
        <h1>Staff Panel</h1>
        <div>
          <span class="admin-user-label" id="admin-user-label"></span>
          <button type="button" class="btn btn-ghost" id="btn-logout" style="margin-left:0.5rem;padding:0.4rem 0.9rem;font-size:0.8rem">ログアウト</button>
        </div>
      </div>

      <div class="card panel-card">
        <h2>ポイント付与</h2>
        <p class="panel-hint">ゲストのマイQRを読み取り、点数を自由入力して付与します</p>

        <div id="staff-reader" class="staff-reader"></div>
        <div class="scan-btns">
          <button type="button" class="btn btn-primary" id="btn-start-scan">ゲストQRをスキャン</button>
          <button type="button" class="btn btn-ghost hidden" id="btn-stop-scan">停止</button>
        </div>
        <p class="form-msg" id="scan-msg"></p>

        <div id="grant-form" class="grant-form hidden">
          <div class="grant-guest">
            <span class="grant-label">対象ゲスト</span>
            <strong id="grant-name">—</strong>
            <span class="grant-id" id="grant-id"></span>
          </div>
          <div class="form-group">
            <label for="game-type">ゲーム</label>
            <select id="game-type">
              <option value="1">ブラックジャック (Point1)</option>
              <option value="2">ポーカー (Point2)</option>
              <option value="3">大富豪 (Point3)</option>
            </select>
          </div>
          <div class="form-group">
            <label for="point-value">付与ポイント（自由入力）</label>
            <input type="number" id="point-value" min="1" max="99999" step="1" placeholder="例: 15" />
          </div>
          <button type="button" class="btn btn-primary" id="btn-grant" style="width:100%;justify-content:center">ポイントを付与</button>
          <button type="button" class="btn btn-ghost" id="btn-clear-guest" style="width:100%;justify-content:center;margin-top:0.5rem">別のゲストを読む</button>
          <p class="form-msg" id="grant-msg"></p>
        </div>
      </div>

      <div class="card panel-card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.8rem">
          <h2 style="margin:0">ゲスト一覧</h2>
          <button type="button" class="btn btn-ghost" id="btn-refresh-guests" style="padding:0.4rem 0.9rem;font-size:0.8rem">更新</button>
        </div>
        <div class="guest-list" id="guest-list"></div>
      </div>
    </section>
  </div>

  <footer class="site-footer">
    <strong>Cabaret Host Casinos</strong><br />
    © 2026 Reitaku H.S. 5G
  </footer>

  <script src="src/js/supabase.js"></script>
  <script src="src/js/main.js"></script>
  <script src="src/js/admin/login.js"></script>
  <script src="src/js/admin/admin.js"></script>
</body>
</html>
