<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>マイポイント | Cabaret Host Casinos</title>
  <link rel="stylesheet" href="src/css/style.css" />
  <link rel="stylesheet" href="src/css/index.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
  <div class="g5-ambient" id="ambient" aria-hidden="true"></div>

  <header class="guest-header">
    <span class="badge">Cabaret Host Casinos</span>
    <h1>My Points</h1>
    <p class="name" id="guest-name">—</p>
    <p class="id-small" id="guest-id"></p>
    <button type="button" class="btn btn-ghost btn-logout" id="btn-logout">ログアウト</button>
  </header>

  <main class="container">
    <div class="points-grid">
      <div class="card point-card">
        <div class="label">Blackjack</div>
        <div class="value" id="point1">0</div>
      </div>
      <div class="card point-card">
        <div class="label">Poker</div>
        <div class="value" id="point2">0</div>
      </div>
      <div class="card point-card">
        <div class="label">Daifugo</div>
        <div class="value" id="point3">0</div>
      </div>
      <div class="card point-card total">
        <div class="label">Total</div>
        <div class="value" id="point-total">0</div>
      </div>
    </div>

    <section class="my-qr-section">
      <h2>マイQR</h2>
      <p class="my-qr-hint">スタッフにこの画面を見せてください</p>
      <div class="my-qr-frame">
        <div id="my-qrcode"></div>
      </div>
      <button type="button" class="btn btn-ghost" id="btn-refresh-points" style="margin-top:1rem">ポイントを更新</button>
      <p class="form-msg" id="refresh-msg"></p>
    </section>
  </main>

  <footer class="site-footer">
    <strong>Cabaret Host Casinos</strong><br />
    © 2026 Reitaku H.S. 5G
  </footer>

  <script src="src/js/supabase.js"></script>
  <script src="src/js/main.js"></script>
  <script src="src/js/index.js"></script>
</body>
</html>
